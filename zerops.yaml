zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:2c6d8ba12d6e38136aef2df991256669cf5116dac7a17645979c70a6aeb66ddc
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:2c6d8ba12d6e38136aef2df991256669cf5116dac7a17645979c70a6aeb66ddc
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
