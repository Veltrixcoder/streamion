zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:8342296a65d6b590d87e7fa4c125bccc727d476b115a437d53e28861806f7324
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:8342296a65d6b590d87e7fa4c125bccc727d476b115a437d53e28861806f7324
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
