zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:4b3c40c54558e46c605b0926b151000f850752473145af553116a5043d3f3190
        
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:4b3c40c54558e46c605b0926b151000f850752473145af553116a5043d3f3190
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
