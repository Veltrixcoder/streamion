zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:20f2adfe8cb637f5999e02bd14f509dd0d5f27cf2789e82256100bbaa2c83150
        
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:20f2adfe8cb637f5999e02bd14f509dd0d5f27cf2789e82256100bbaa2c83150
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
