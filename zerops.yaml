zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:b660d2d2d9de8376b152a7fe9e49b531c5677b23050bb815bfd95792d2944bce
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:b660d2d2d9de8376b152a7fe9e49b531c5677b23050bb815bfd95792d2944bce
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
