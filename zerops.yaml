zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:b5a092c39768bfcf6f602bfb36b64f550da0f0303fb2719dc095b12cddc0c486
        
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:b5a092c39768bfcf6f602bfb36b64f550da0f0303fb2719dc095b12cddc0c486
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
