zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:e0152e1b6dccf0d96f5f0e727f7df0f9bd71f5fe77de67af4a62971281185a71
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:e0152e1b6dccf0d96f5f0e727f7df0f9bd71f5fe77de67af4a62971281185a71
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
