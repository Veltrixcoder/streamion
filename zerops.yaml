zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:3cb12c7c846c0aa65e17fcf8e5d3dfde73a9ac974c1ae5cd38d1ed6cbd7f471d

      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:3cb12c7c846c0aa65e17fcf8e5d3dfde73a9ac974c1ae5cd38d1ed6cbd7f471d
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
