zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:22eb6c99c08a50217552222f0eba0e28004cfc13f237b5864da827db52852c9a
        
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:22eb6c99c08a50217552222f0eba0e28004cfc13f237b5864da827db52852c9a
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
