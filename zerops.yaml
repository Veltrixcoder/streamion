zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:02ea54926b93e8db6b4abe7ad4b0033fc39f741a656740f2af70a190790de2d4
        
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:02ea54926b93e8db6b4abe7ad4b0033fc39f741a656740f2af70a190790de2d4
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
