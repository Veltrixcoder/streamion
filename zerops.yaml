zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:9fb7e14d5b20f243ec3afc31e599e187cf6fa6dd69b67c5e1fa620eabadad7c0
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:9fb7e14d5b20f243ec3afc31e599e187cf6fa6dd69b67c5e1fa620eabadad7c0
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
