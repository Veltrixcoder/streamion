zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registry
      prepareCommands:
        - docker image pull ghcr.io/shashwat-coding/streamion:main

      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/streamion:main

      # expose port (change if your app uses something else)
      ports:
        - port: 8000
          httpSupport: true
