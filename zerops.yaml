zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:2b1c482505377eeb41c2fda7c96531d5b3f626dd9a0863fb5088ee9175c5bb4d
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:2b1c482505377eeb41c2fda7c96531d5b3f626dd9a0863fb5088ee9175c5bb4d
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
