zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker image pull ghcr.io/shashwat-coding/laughing-potato@sha256:0d2d855d1f3004d663b10a5e3b8adc6e2498dc5319a2eb1afdbb6b5efa18d2ee

      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato@sha256:0d2d855d1f3004d663b10a5e3b8adc6e2498dc5319a2eb1afdbb6b5efa18d2ee

      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
