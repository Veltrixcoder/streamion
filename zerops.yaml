zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:3ca2f417209538d6bbb8906ae82d6b332ab3528309445c24ba2c60cde1e72bbc
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:3ca2f417209538d6bbb8906ae82d6b332ab3528309445c24ba2c60cde1e72bbc
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
