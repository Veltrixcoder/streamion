zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:b9d3b4e724618bdec5af99a1bb3feed94a77f2a621823df9781f87af0cb3c841
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:b9d3b4e724618bdec5af99a1bb3feed94a77f2a621823df9781f87af0cb3c841
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
