zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:029f9cdd894c276dfe67e9f35220c2188952f499fc58a8340077dd790ed7df93
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:029f9cdd894c276dfe67e9f35220c2188952f499fc58a8340077dd790ed7df93
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
