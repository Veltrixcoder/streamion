zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker image pull ghcr.io/shashwat-coding/laughing-potato:main

      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main

      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
