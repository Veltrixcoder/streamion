      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:15f34f633c551466e2b45fae118bc14d9dab1ed26fa3a3628f96cb5fd9d5f8f6
      # expose port (change if your app uses something else)
