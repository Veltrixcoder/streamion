zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:3a65a930d42f36b60421f26f07a5bc78cacebba6eea6d9f65f2f97ef485a3999
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:3a65a930d42f36b60421f26f07a5bc78cacebba6eea6d9f65f2f97ef485a3999
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
