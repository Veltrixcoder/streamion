zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:490ef3c6c7deb47ccb97cf2315d6c35652878c8b700c005d28588888dbc48b07
        
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:490ef3c6c7deb47ccb97cf2315d6c35652878c8b700c005d28588888dbc48b07
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
