zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:27d7991a824a34f91826510102bd9f80a0e2758fe452a04a3df05ed59e2c28c3
        
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:27d7991a824a34f91826510102bd9f80a0e2758fe452a04a3df05ed59e2c28c3
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
