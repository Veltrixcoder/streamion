zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:722a8fd433bc3e72ef7657a16f0aa9e92e9fb0ccd6518e74f4d347e6689c4386
      
      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:722a8fd433bc3e72ef7657a16f0aa9e92e9fb0ccd6518e74f4d347e6689c4386
      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
